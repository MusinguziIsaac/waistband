<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>

  <!-- 3D Glowing Globe Symbol for Favicon -->
  <g transform="translate(80, 80) scale(1.05)" filter="url(#fav-glow)">
    <!-- WiFi Signal Arcs -->
    <path d="M 12 -44 A 48 48 0 0 1 58 0" stroke="url(#fav-grad)" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M 12 -30 A 34 34 0 0 1 43 0" stroke="url(#fav-grad)" stroke-width="8.5" stroke-linecap="round" fill="none" />
    <path d="M 12 -16 A 20 20 0 0 1 28 0" stroke="url(#fav-grad)" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 12 -44 A 48 48 0 0 1 58 0" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- 3D Globe Mesh -->
    <ellipse cx="0" cy="0" rx="55" ry="55" fill="none" stroke="url(#fav-grad)" stroke-width="7" />
    <ellipse cx="0" cy="0" rx="55" ry="25" fill="none" stroke="url(#fav-grad)" stroke-width="5.5" />
    <ellipse cx="0" cy="0" rx="25" ry="55" fill="none" stroke="url(#fav-grad)" stroke-width="5.5" />
    <line x1="-55" y1="0" x2="55" y2="0" stroke="url(#fav-grad)" stroke-width="5.5" />
    <line x1="0" y1="-55" x2="0" y2="55" stroke="url(#fav-grad)" stroke-width="5.5" />
    <line x1="-38" y1="-38" x2="38" y2="38" stroke="url(#fav-grad)" stroke-width="4.5" />
    <line x1="-38" y1="38" x2="38" y2="-38" stroke="url(#fav-grad)" stroke-width="4.5" />

    <!-- 3D Nodes -->
    <g fill="#4ade80" stroke="#ffffff" stroke-width="1.5">
      <circle cx="0" cy="0" r="7" />
      <circle cx="-55" cy="0" r="6" />
      <circle cx="55" cy="0" r="6" />
      <circle cx="0" cy="-55" r="6" />
      <circle cx="0" cy="55" r="6" />
      <circle cx="-38" cy="-38" r="6" />
      <circle cx="38" cy="-38" r="6" />
      <circle cx="-38" cy="38" r="6" />
      <circle cx="38" cy="38" r="6" />
    </g>
  </g>
</svg>