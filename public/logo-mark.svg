<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- High contrast, bold green network globe & WiFi symbol -->
  <g transform="translate(48, 52) scale(0.72)">
    <!-- WiFi Signal Arcs (Thick & Bold) -->
    <path d="M 12 -44 A 48 48 0 0 1 58 0" stroke="#059669" stroke-width="7" fill="none" stroke-linecap="round" />
    <path d="M 12 -30 A 34 34 0 0 1 43 0" stroke="#10b981" stroke-width="6.5" fill="none" stroke-linecap="round" />
    <path d="M 12 -16 A 20 20 0 0 1 28 0" stroke="#34d399" stroke-width="6" fill="none" stroke-linecap="round" />

    <!-- Network Globe Main Lines -->
    <ellipse cx="0" cy="0" rx="55" ry="55" fill="none" stroke="#059669" stroke-width="6" />
    <ellipse cx="0" cy="0" rx="55" ry="25" fill="none" stroke="#10b981" stroke-width="5" />
    <ellipse cx="0" cy="0" rx="25" ry="55" fill="none" stroke="#10b981" stroke-width="5" />
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#059669" stroke-width="5" />
    <line x1="0" y1="-55" x2="0" y2="55" stroke="#059669" stroke-width="5" />
    
    <!-- Diagonal mesh connections -->
    <line x1="-38" y1="-38" x2="38" y2="38" stroke="#059669" stroke-width="4" />
    <line x1="-38" y1="38" x2="38" y2="-38" stroke="#059669" stroke-width="4" />

    <!-- Network Interconnection Nodes -->
    <circle cx="0" cy="0" r="6" fill="#047857" />
    <circle cx="-55" cy="0" r="5" fill="#047857" />
    <circle cx="55" cy="0" r="5" fill="#047857" />
    <circle cx="0" cy="-55" r="5" fill="#047857" />
    <circle cx="0" cy="55" r="5" fill="#047857" />
    <circle cx="-38" cy="-38" r="5" fill="#047857" />
    <circle cx="38" cy="-38" r="5" fill="#047857" />
    <circle cx="-38" cy="38" r="5" fill="#047857" />
    <circle cx="38" cy="38" r="5" fill="#047857" />
    <circle cx="-25" cy="0" r="4.5" fill="#10b981" />
    <circle cx="25" cy="0" r="4.5" fill="#10b981" />
    <circle cx="0" cy="-25" r="4.5" fill="#10b981" />
    <circle cx="0" cy="25" r="4.5" fill="#10b981" />
  </g>
</svg>
